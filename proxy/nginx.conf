# NGINX Configuration for Wedding Invitation Platform
# Handles subdomain routing, SSL termination, and load balancing

# Upstream servers
upstream backend_api {
    server invitation-api:8080;
    keepalive 32;
}

upstream cms_frontend {
    server invitation-cms:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rsvp_limit:10m rate=2r/s;

# Main server for API (api.yourdomain.com)
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Redirect to HTTPS in production
    # return 301 https://$server_name$request_uri;
    
    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
    }
}

# CMS Admin (admin.yourdomain.com)
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com cms.yourdomain.com;

    location / {
        proxy_pass http://cms_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Wildcard subdomain for client invitations (*.yourdomain.com)
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>.+)\.yourdomain\.com$;

    # Skip reserved subdomains
    if ($subdomain ~* ^(www|api|admin|cms|mail|smtp|ftp)$) {
        return 404;
    }

    # Static assets
    location /assets/ {
        alias /var/www/invitation/public/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploads
    location /uploads/ {
        alias /var/www/invitation/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # htmx endpoints - route to backend
    location ~ ^/(gallery|messages|gift|rsvp)$ {
        # Rewrite to include subdomain
        rewrite ^/(.*)$ /$subdomain/$1 break;
        
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Subdomain $subdomain;
        
        # Rate limit RSVP submissions
        limit_req zone=rsvp_limit burst=5 nodelay;
    }

    # Main invitation page
    location / {
        # Rewrite to include subdomain in path
        rewrite ^/(.*)$ /$subdomain/$1 break;
        
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Subdomain $subdomain;
    }
}

# Default server - redirect to main site
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    location / {
        return 301 https://yourdomain.com$request_uri;
    }
}
