version: "3.8"

services:
  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invitation-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-admin12345}
      - DB_NAME=${DB_NAME:-invitation_db}
      - DB_SSLMODE=disable
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ACCESS_TOKEN_TTL=60m
      - JWT_REFRESH_TOKEN_TTL=168h
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invitation-network
    volumes:
      - ./uploads:/app/uploads

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: invitation-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin12345}
      - POSTGRES_DB=${DB_NAME:-invitation_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-invitation_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invitation-network

networks:
  invitation-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
