version: "3.8"

services:
  # Application service with hot-reload
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: invitation-api-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=admin12345
      - DB_NAME=invitation_db
      - DB_SSLMODE=disable
      - JWT_SECRET_KEY=dev-secret-key
      - JWT_ACCESS_TOKEN_TTL=60m
      - JWT_REFRESH_TOKEN_TTL=168h
      - APP_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invitation-network-dev
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod

  # PostgreSQL database for development
  postgres:
    image: postgres:15-alpine
    container_name: invitation-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin12345
      - POSTGRES_DB=invitation_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invitation_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invitation-network-dev

  # Adminer for database management (optional)
  adminer:
    image: adminer:latest
    container_name: invitation-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - invitation-network-dev

networks:
  invitation-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
  go_modules:
    driver: local
