version: "3.8"

services:
  # Backend API
  api:
    build:
      context: ./BE Invitation
      dockerfile: Dockerfile
    container_name: invitation-api
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-admin12345}
      - DB_NAME=${DB_NAME:-invitation_db}
      - DB_SSLMODE=disable
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key}
      - APP_ENV=production
      - APP_BASE_DOMAIN=${BASE_DOMAIN:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invitation-network
    volumes:
      - ./uploads:/app/uploads
      - ./BE Invitation/internal/templates:/app/internal/templates:ro

  # CMS Frontend (Nuxt)
  cms:
    build:
      context: ./FE CMS Invitation
      dockerfile: Dockerfile
    container_name: invitation-cms
    restart: unless-stopped
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://api.${BASE_DOMAIN:-localhost}:8080/api/v1
    networks:
      - invitation-network

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: invitation-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin12345}
      - POSTGRES_DB=${DB_NAME:-invitation_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invitation-network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: invitation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./BE Invitation/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./FE User/public:/var/www/invitation/public:ro
      - ./uploads:/var/www/invitation/uploads:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - cms
    networks:
      - invitation-network

networks:
  invitation-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
